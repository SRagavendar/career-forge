[project]
name = "career-forge"
version = "0.1.0"
description = "AI job seach pipeline with Python & Gemini"
authors = [
    {name = "Senthil Ragavendar"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
packages = [
    {include = "src"}
]
package-mode = false
dependencies = [
    "typer[all] (>=0.27.0,<0.28.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "google-generativeai (>=0.8.6,<0.9.0)",
    "playwright (>=1.61.0,<2.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "duckdb (>=1.5.5,<2.0.0)",
    "python-frontmatter (>=1.3.0,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]

[project.scripts]
career-forge = "src.cli.main:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.0,<3.0.0)"
]
